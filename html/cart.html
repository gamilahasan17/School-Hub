<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SchoolHub - السلة</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
  <link rel="stylesheet" href="../css/Al-Ahrm.css">
</head>
<body>

  <nav class="top-nav">
    <a href="../index.html" class="logo">SchoolHub</a>
  </nav>

  <div class="container my-5">
    <h2 class="mb-4 text-center">سلة المشتريات</h2>

    <div id="empty_cart" class="text-center text-muted py-5" style="display:none;">
      <i class="fa-solid fa-cart-shopping fa-3x mb-3"></i>
      <p>السلة فارغة حالياً</p>
      <a href="../index.html" class="btn-serch btn mt-2">تصفح المنتجات</a>
    </div>

    <div class="row">
      <div class="col-12 col-lg-8">
        <div id="cart_items"></div>
      </div>

      <div class="col-12 col-lg-4">
        <div id="cart_summary" class="border rounded p-4" style="display:none;">
          <h5 class="mb-3">ملخص الطلب</h5>
          <div class="d-flex justify-content-between mb-3">
            <span>الإجمالي</span>
            <strong id="cart_total">0 EGP</strong>
          </div>
          <button class="buy-btn w-100 ">إتمام الشراء</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../JS/API.js"></script>
  <script>
    renderCart();
  </script>
  <script src="../JS/main.js"></script>
</body>
</html>
